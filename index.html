<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00ff41">
<title>কোডবন্ধু — তোমার AI প্রোগ্রামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#00ff41;--brand-dark:#00cc33;--brand-light:#4ade80;
  --bg:#000000;--bg-alt:#0a0a0a;--surface:#111111;--surface-hover:#1a1a1a;
  --text:#e0e0e0;--text-secondary:#00cc33;--text-muted:#4a7c59;
  --border:#1f3a26;--border-light:#2a5033;
  --danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--purple:#8b5cf6;
  --font-bn:'Hind Siliguri',system-ui,sans-serif;
  --font-code:'JetBrains Mono',monospace;
  --font-en:'Plus Jakarta Sans',system-ui,sans-serif;
  --glow:0 0 20px rgba(0,255,65,.3);
}
[data-theme="light"]{
  --bg:#f0fdf4;--bg-alt:#dcfce7;--surface:#ffffff;--surface-hover:#f0fdf4;
  --text:#052e16;--text-secondary:#166534;--text-muted:#4ade80;
  --border:#bbf7d0;--border-light:#dcfce7;
  --glow:0 0 15px rgba(22,101,52,.15);
}
html,body{height:100%}
body{font-family:var(--font-bn);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--brand-dark);border-radius:10px}
::-webkit-scrollbar-track{background:var(--bg-alt)}

/* ============ SPLASH ============ */
#splash{
  position:fixed;inset:0;z-index:99999;
  background:radial-gradient(ellipse at center,#0a1a0f 0%,#000 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s;overflow:hidden;
}
#splash.hide{opacity:0;pointer-events:none}
/* ম্যাট্রিক্স ব্যাকগ্রাউন্ড */
.matrix-bg{position:absolute;inset:0;opacity:.15;overflow:hidden}
.matrix-bg span{
  position:absolute;top:-100px;color:#00ff41;
  font-family:var(--font-code);font-size:14px;font-weight:600;
  animation:matrixFall linear infinite;
  white-space:nowrap;
}
@keyframes matrixFall{
  0%{transform:translateY(-100px);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(100vh);opacity:0}
}

.splash-logo{
  position:relative;z-index:2;
  width:120px;height:120px;border-radius:24px;
  background:linear-gradient(135deg,#0a1a0f,#000);
  border:3px solid var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:56px;
  box-shadow:0 0 40px rgba(0,255,65,.5),inset 0 0 30px rgba(0,255,65,.15);
  animation:logoPulse 2s ease-in-out infinite;
  margin-bottom:24px;
}
@keyframes logoPulse{
  0%,100%{box-shadow:0 0 40px rgba(0,255,65,.5),inset 0 0 30px rgba(0,255,65,.15)}
  50%{box-shadow:0 0 60px rgba(0,255,65,.8),inset 0 0 40px rgba(0,255,65,.25)}
}
.splash-title{
  position:relative;z-index:2;
  font-family:var(--font-code);font-size:clamp(32px,9vw,46px);
  font-weight:800;color:var(--brand);
  letter-spacing:2px;
  text-shadow:0 0 20px rgba(0,255,65,.6);
  display:flex;gap:2px;justify-content:center;
  margin-bottom:8px;
}
.splash-title span{
  display:inline-block;opacity:0;
  animation:letterGlow .4s forwards;
}
@keyframes letterGlow{
  0%{opacity:0;transform:translateY(20px);text-shadow:0 0 40px #00ff41}
  100%{opacity:1;transform:translateY(0);text-shadow:0 0 20px rgba(0,255,65,.6)}
}
.splash-sub{
  position:relative;z-index:2;
  font-size:12px;color:var(--text-muted);
  letter-spacing:4px;text-transform:uppercase;
  margin-bottom:40px;
  opacity:0;animation:fadeIn .6s .8s forwards;
}
@keyframes fadeIn{to{opacity:1}}
.splash-cursor{
  display:inline-block;width:10px;height:16px;
  background:var(--brand);margin-left:4px;
  animation:blink 1s infinite;
}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.splash-status{
  position:relative;z-index:2;
  font-family:var(--font-code);font-size:13px;
  color:var(--text-muted);margin-top:20px;
  opacity:0;animation:fadeIn .6s 1s forwards;
}
.splash-status::after{
  content:'.';animation:dots 1.5s steps(4,end) infinite;
}
@keyframes dots{0%{content:'.'}25%{content:'..'}50%{content:'...'}75%,100%{content:''}}

/* ============ HEADER ============ */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
}
[data-theme="light"] .header{background:rgba(240,253,244,.85)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:none;color:inherit;font-family:inherit;cursor:pointer}
.brand-logo{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,#0a1a0f,#000);
  border:2px solid var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 0 15px rgba(0,255,65,.4);
}
.brand-text{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.brand-name{
  font-family:var(--font-code);font-size:16px;font-weight:800;
  color:var(--brand);letter-spacing:1px;
  text-shadow:0 0 10px rgba(0,255,65,.4);
}
.brand-tag{font-size:10px;color:var(--text-muted);font-weight:500}

.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text-secondary);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.icon-btn:hover{background:var(--brand);color:#000;border-color:var(--brand);box-shadow:0 0 15px rgba(0,255,65,.4)}

/* ============ MAIN ============ */
main{max-width:900px;margin:0 auto;padding:16px 16px 100px;min-height:calc(100vh - 64px);display:flex;flex-direction:column}

/* ============ WELCOME SCREEN ============ */
.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:30px 20px;animation:fadeIn .5s;
}
.welcome-robot{
  font-size:100px;margin-bottom:20px;
  animation:robotFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 30px rgba(0,255,65,.5));
}
@keyframes robotFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-12px) rotate(3deg)}
}
.welcome-title{
  font-family:var(--font-code);font-size:clamp(20px,5vw,28px);
  font-weight:800;color:var(--brand);margin-bottom:10px;
  letter-spacing:1px;
  text-shadow:0 0 15px rgba(0,255,65,.4);
}
.welcome-sub{
  font-size:14px;color:var(--text-muted);
  max-width:400px;margin:0 auto 28px;line-height:1.7;
}
.welcome-window{
  width:100%;max-width:600px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;overflow:hidden;
  margin-bottom:20px;text-align:left;
  box-shadow:var(--glow);
}
.welcome-window-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--bg-alt);
  border-bottom:1px solid var(--border);
}
.win-dot{width:12px;height:12px;border-radius:50%}
.win-dot.red{background:#ff5f57}
.win-dot.yellow{background:#febc2e}
.win-dot.green{background:#28c840}
.window-title{
  font-family:var(--font-code);font-size:11px;
  color:var(--text-muted);margin-left:8px;
}
.welcome-code{
  padding:16px;font-family:var(--font-code);
  font-size:13px;line-height:1.8;color:var(--text);
}
.welcome-code .cm{color:#6a9955}
.welcome-code .kw{color:#569cd6}
.welcome-code .str{color:#ce9178}
.welcome-code .fn{color:#dcdcaa}
.welcome-code .vr{color:#9cdcfe}

.welcome-btn{
  padding:16px 32px;border-radius:14px;
  background:linear-gradient(135deg,#00ff41,#00cc33);
  color:#000;font-family:var(--font-code);
  font-weight:800;font-size:15px;
  display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 0 30px rgba(0,255,65,.4),0 5px 0 #008c2a;
  transition:all .15s;
  margin-bottom:24px;
}
.welcome-btn:active{transform:translateY(3px);box-shadow:0 0 30px rgba(0,255,65,.4),0 2px 0 #008c2a}

/* দ্রুত প্রশ্ন */
.quick-chips{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:600px;
}
.chip{
  padding:10px 16px;border-radius:99px;
  background:var(--surface);border:1.5px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text-secondary);
  cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 0 15px rgba(0,255,65,.2)}
.chip .ico{font-size:14px}

/* ============ CHAT SCREEN ============ */
.chat-container{flex:1;display:none;flex-direction:column}
.chat-container.active{display:flex;animation:fadeIn .3s}

.chat-header-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;margin-bottom:14px;
}
.chat-header-left{display:flex;align-items:center;gap:10px}
.chat-avatar{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#0a1a0f,#000);
  border:1.5px solid var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 0 15px rgba(0,255,65,.3);
}
.chat-info h3{
  font-family:var(--font-code);font-size:14px;font-weight:800;
  color:var(--brand);letter-spacing:.5px;
}
.chat-info p{
  font-size:10px;color:var(--text-muted);
  display:flex;align-items:center;gap:4px;
}
.chat-info p::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--brand);box-shadow:0 0 6px var(--brand);
  animation:dotPulse 2s infinite;
}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}

.chat-actions{display:flex;gap:6px}
.chat-mini-btn{
  width:34px;height:34px;border-radius:8px;
  background:var(--bg-alt);border:1.5px solid var(--border);
  color:var(--text-secondary);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.chat-mini-btn:hover{background:var(--brand);color:#000;border-color:var(--brand)}
.chat-mini-btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}

/* মেসেজ */
.chat-messages{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding-bottom:16px;
  overflow-y:auto;
}
.msg{max-width:92%;animation:msgIn .3s}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.msg.me{align-self:flex-end}
.msg.ai{align-self:flex-start;max-width:100%;width:100%}

.msg-bubble{
  padding:12px 16px;border-radius:14px;
  font-size:14px;line-height:1.7;
  word-wrap:break-word;
}
.msg.me .msg-bubble{
  background:linear-gradient(135deg,#00ff41,#00cc33);
  color:#000;font-weight:500;
  border-bottom-right-radius:4px;
  box-shadow:0 0 20px rgba(0,255,65,.2);
}
.msg.ai .msg-bubble{
  background:var(--surface);
  border:1.5px solid var(--border);
  color:var(--text);
  border-bottom-left-radius:4px;
}

/* কোড ব্লক */
.code-block{
  margin:12px 0;border-radius:10px;overflow:hidden;
  background:#0d1117;border:1px solid #30363d;
  position:relative;
}
.code-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:#161b22;
  border-bottom:1px solid #30363d;
}
.code-lang{
  font-family:var(--font-code);font-size:11px;
  font-weight:700;color:#58a6ff;text-transform:uppercase;
  letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.code-lang::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:#58a6ff;box-shadow:0 0 6px #58a6ff;
}
.code-actions{display:flex;gap:4px}
.code-btn{
  padding:5px 10px;border-radius:6px;
  background:#21262d;border:1px solid #30363d;
  color:#c9d1d9;font-size:10px;font-weight:700;
  font-family:var(--font-code);
  cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:4px;
}
.code-btn:hover{background:#30363d;border-color:#58a6ff;color:#58a6ff}
.code-btn.success{background:#238636;border-color:#2ea043;color:#fff}

.code-block pre{
  margin:0;padding:14px;overflow-x:auto;
  font-family:var(--font-code);font-size:13px;line-height:1.6;
  color:#c9d1d9;
}
.code-block code{font-family:var(--font-code)}

/* AI টাইপিং */
.typing{
  display:flex;align-items:center;gap:6px;
  padding:12px 16px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:14px;
  border-bottom-left-radius:4px;
  width:fit-content;
}
.typing-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--brand);animation:typingBounce 1.2s infinite;
}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-8px);opacity:1}
}

/* চ্যাট ইনপুট */
.chat-input-wrap{
  position:sticky;bottom:0;
  background:var(--bg);padding:12px 0 16px;
  border-top:1px solid var(--border-light);
  z-index:50;
}
.chat-input-inner{
  display:flex;gap:8px;align-items:flex-end;
  background:var(--surface);border:2px solid var(--border);
  border-radius:18px;padding:6px 6px 6px 14px;
  transition:border-color .2s;
}
.chat-input-inner:focus-within{
  border-color:var(--brand);
  box-shadow:0 0 20px rgba(0,255,65,.2);
}
.chat-input{
  flex:1;padding:10px 4px;background:transparent;
  border:none;color:var(--text);
  font-family:var(--font-bn);font-size:15px;
  outline:none;resize:none;max-height:120px;
  line-height:1.5;
}
.chat-input::placeholder{color:var(--text-muted)}
.chat-send{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#00ff41,#00cc33);
  color:#000;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 15px rgba(0,255,65,.4);
  transition:all .15s;
}
.chat-send:active{transform:scale(.92)}
.chat-send:disabled{opacity:.4;cursor:not-allowed}

/* ============ TOAST ============ */
.toast{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%) translateY(-120px);
  background:var(--surface);border:2px solid var(--brand);
  padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:700;color:var(--text);
  z-index:1000;transition:transform .4s cubic-bezier(.5,1.5,.7,1);
  box-shadow:0 0 30px rgba(0,255,65,.4);
  max-width:90vw;text-align:center;
  font-family:var(--font-bn);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{border-color:var(--danger);box-shadow:0 0 30px rgba(239,68,68,.4)}
.toast.success{border-color:var(--brand);box-shadow:0 0 30px rgba(0,255,65,.4)}

/* ============ RESPONSIVE ============ */
@media(max-width:640px){
  .welcome-robot{font-size:80px}
  .msg{max-width:95%}
  .code-block pre{font-size:12px;padding:12px}
}

/* Syntax highlight overrides */
.hljs{background:transparent !important;padding:0 !important}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="matrix-bg" id="matrixBg"></div>
  <div class="splash-logo">💻</div>
  <div class="splash-title" id="splashTitle"></div>
  <div class="splash-sub">Your AI Programmer</div>
  <div class="splash-status" id="splashStatus">বুট হচ্ছে</div>
</div>

<!-- ============ HEADER ============ -->
<header class="header">
  <div class="header-inner">
    <button class="brand" onclick="goHome()">
      <div class="brand-logo">💻</div>
      <div class="brand-text">
        <span class="brand-name">CodeBondhu</span>
        <span class="brand-tag">তোমার AI প্রোগ্রামার</span>
      </div>
    </button>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="থিম">
        <i class="fas fa-sun" id="themeIcon"></i>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main>
  <!-- WELCOME -->
  <div class="welcome" id="welcomeScreen">
    <div class="welcome-robot">💻</div>
    <div class="welcome-title">হ্যালো! আমি কোডবন্ধু</div>
    <div class="welcome-sub">তোমার AI প্রোগ্রামার। যেকোনো ভাষায় কোড লিখে দেব — Python, HTML, CSS, PHP, JavaScript, যেকোনো কিছু।</div>
    
    <div class="welcome-window">
      <div class="welcome-window-header">
        <span class="win-dot red"></span>
        <span class="win-dot yellow"></span>
        <span class="win-dot green"></span>
        <span class="window-title">welcome.py</span>
      </div>
      <div class="welcome-code">
        <div><span class="cm"># আমি কোডবন্ধু</span></div>
        <div><span class="kw">def</span> <span class="fn">hello</span>():</div>
        <div style="padding-left:20px"><span class="vr">print</span>(<span class="str">"কী বানাতে চাও? বলো!"</span>)</div>
        <div style="margin-top:8px"><span class="fn">hello</span>()<span class="splash-cursor"></span></div>
      </div>
    </div>
    
    <button class="welcome-btn" onclick="startChat()">
      <i class="fas fa-comments"></i>
      চ্যাট শুরু করো
    </button>
    
    <div class="quick-chips">
      <button class="chip" onclick="quickAsk('একটা লগইন সিস্টেম বানাও HTML, CSS, PHP দিয়ে')"><span class="ico">🔐</span> লগইন সিস্টেম</button>
      <button class="chip" onclick="quickAsk('Python দিয়ে একটা ক্যালকুলেটর বানাও')"><span class="ico">🐍</span> Python ক্যালকুলেটর</button>
      <button class="chip" onclick="quickAsk('একটা সুন্দর ল্যান্ডিং পেজ বানাও HTML CSS দিয়ে')"><span class="ico">🌐</span> ল্যান্ডিং পেজ</button>
      <button class="chip" onclick="quickAsk('JavaScript দিয়ে একটা গেম বানাও')"><span class="ico">🎮</span> JS গেম</button>
      <button class="chip" onclick="quickAsk('একটা ব্লগ ওয়েবসাইট বানাও PHP MySQL দিয়ে')"><span class="ico">📝</span> ব্লগ সাইট</button>

/* ============================================================
   AI মেসেজ ফরম্যাট — কোড ব্লক ডিটেক্ট
   ============================================================ */
function formatAIMessage(text){
  if(!text) return '';
  
  // মার্কডাউন কোড ব্লক ডিটেক্ট ```lang ... ```
  var codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
  var parts = [];
  var lastIndex = 0;
  var match;
  
  while((match = codeBlockRegex.exec(text)) !== null){
    // টেক্সট অংশ
    if(match.index > lastIndex){
      var textPart = text.substring(lastIndex, match.index);
      parts.push({ type: 'text', content: textPart });
    }
    
    // কোড অংশ
    parts.push({
      type: 'code',
      lang: match[1] || 'text',
      content: match[2].trim()
    });
    
    lastIndex = match.index + match[0].length;
  }
  
  // শেষ টেক্সট
  if(lastIndex < text.length){
    parts.push({ type: 'text', content: text.substring(lastIndex) });
  }
  
  // যদি কোনো কোড ব্লক না থাকে
  if(parts.length === 0){
    parts.push({ type: 'text', content: text });
  }
  
  // রেন্ডার করি
  var html = '';
  parts.forEach(function(p, idx){
    if(p.type === 'text'){
      html += formatText(p.content);
    } else {
      var lang = escapeHtml(p.lang);
      var id = 'code_' + Date.now() + '_' + idx;
      html += 
        '<div class="code-block" data-lang="' + lang + '">' +
          '<div class="code-header">' +
            '<span class="code-lang">' + lang + '</span>' +
            '<div class="code-actions">' +
              '<button class="code-btn copy-btn" data-code-id="' + id + '"><i class="fas fa-copy"></i> কপি</button>' +
              '<button class="code-btn download-btn" data-code-id="' + id + '" data-lang="' + lang + '"><i class="fas fa-download"></i></button>' +
            '</div>' +
          '</div>' +
          '<pre><code id="' + id + '" class="language-' + lang + '">' + escapeHtml(p.content) + '</code></pre>' +
        '</div>';
    }
  });
  
  return html;
}

/* ============================================================
   সাধারণ টেক্সট ফরম্যাট (মার্কডাউন স্টাইল)
   ============================================================ */
function formatText(text){
  if(!text) return '';
  
  var html = escapeHtml(text);
  
  // বোল্ড **text**
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  
  // ইটালিক *text*
  html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<i>$1</i>');
  
  // ইনলাইন কোড `code`
  html = html.replace(/`([^`\n]+)`/g, '<code style="background:#0d1117;color:#00ff41;padding:2px 6px;border-radius:4px;font-family:var(--font-code);font-size:13px;border:1px solid #30363d">$1</code>');
  
  // লাইন ব্রেক
  html = html.replace(/\n/g, '<br>');
  
  return html;
}

/* ============================================================

function highlightCodes(container){
  if(typeof hljs === 'undefined') return;

/* ============================================================
   কোড কপি ও ডাউনলোড বাটন
   ============================================================ */
function attachCodeButtons(container){
  // কপি বাটন
  container.querySelectorAll('.copy-btn').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.dataset.codeId;
      var codeEl = document.getElementById(id);
      if(!codeEl) return;
      
      var code = codeEl.textContent;
      
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){
          btn.innerHTML = '<i class="fas fa-check"></i> কপি হয়েছে';
          btn.classList.add('success');
          setTimeout(function(){
            btn.innerHTML = '<i class="fas fa-copy"></i> কপি';
            btn.classList.remove('success');
          }, 2000);
          showToast('✅ কোড কপি হয়েছে', 'success');
        }).catch(function(){
          fallbackCopy(code, btn);
        });
      } else {
        fallbackCopy(code, btn);
      }
    };
  });
  
  // ডাউনলোড বাটন
  container.querySelectorAll('.download-btn').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.dataset.codeId;
      var lang = btn.dataset.lang || 'txt';
      var codeEl = document.getElementById(id);
      if(!codeEl) return;
      
      var code = codeEl.textContent;
      var ext = getExtension(lang);
      var filename = 'codebondhu_' + Date.now() + '.' + ext;
      
      var blob = new Blob([code], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showToast('💾 ডাউনলোড হয়েছে: ' + filename, 'success');
    };
  });
}

function fallbackCopy(text, btn){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    btn.innerHTML = '<i class="fas fa-check"></i> কপি হয়েছে';
    btn.classList.add('success');
    setTimeout(function(){
      btn.innerHTML = '<i class="fas fa-copy"></i> কপি';
      btn.classList.remove('success');
    }, 2000);
    showToast('✅ কোড কপি হয়েছে', 'success');
  }catch(e){
    showToast('❌ কপি করা যায়নি', 'error');
  }
  document.body.removeChild(ta);
}

function getExtension(lang){
  var map = {
    'python': 'py', 'py': 'py',
    'html': 'html',
    'css': 'css',
    'javascript': 'js', 'js': 'js',
    'typescript': 'ts', 'ts': 'ts',
    'php': 'php',
    'java': 'java',
    'c': 'c',
    'cpp': 'cpp', 'c++': 'cpp',
    'csharp': 'cs', 'c#': 'cs',
    'sql': 'sql',
    'json': 'json',
    'xml': 'xml',
    'bash': 'sh', 'shell': 'sh',
    'jsx': 'jsx',
    'tsx': 'tsx',
    'vue': 'vue',
    'go': 'go',
    'rust': 'rs',
    'ruby': 'rb',
    'kotlin': 'kt',
    'swift': 'swift',
    'dart': 'dart',
    'text': 'txt'
  };
  return map[lang.toLowerCase()] || 'txt';
}

/* ============================================================
   AI কল
   ============================================================ */
function callAI(messages){
  var apiMessages = [
    { role: 'system', content: SYSTEM_PROMPT }
  ].concat(messages.slice(-10)); // শেষ ১০টি মেসেজ
  
  return fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: apiMessages })
  })
  .then(function(res){
    if(!res.ok){
      return res.text().then(function(txt){
        throw new Error('HTTP ' + res.status + ': ' + (txt.substring(0, 150) || 'Unknown'));
      });
    }
    return res.json();
  })
  .then(function(data){
    if(data && data.choices && data.choices[0] && data.choices[0].message){
      return data.choices[0].message.content.trim();
    }
    if(data && data.error) throw new Error(data.error.message || 'AI error');
    throw new Error('উত্তর পাওয়া যায়নি');
  });
}

  div.innerHTML = 
    '<div class="typing">' +
      '<div class="typing-dot"></div>' +
      '<div class="typing-dot"></div>' +
      '<div class="typing-dot"></div>' +
    '</div>';
  
  wrap.appendChild(div);
  setTimeout(function(){ 
    wrap.scrollTop = wrap.scrollHeight;
  }, 50);
  
  return div;
}

/* ============================================================
   চ্যাট ক্লিয়ার
   ============================================================ */
function clearChat(){
  if(STATE.messages.length === 0){
    showToast('ℹ️ চ্যাট খালি');
    return;
  }
  
  if(!confirm('চ্যাট মুছে ফেলবেন?')) return;
  
  STATE.messages = [];
  saveChat();
  
  var wrap = document.getElementById('chatMessages');
  if(wrap) wrap.innerHTML = '';
  
  addMessage('ai', 'নতুন চ্যাট শুরু! 💻<br><br>কী বানাতে চাও?');
  showToast('🔄 চ্যাট রিসেট হয়েছে', 'success');
}

/* ============================================================
   চ্যাট সেভ
   ============================================================ */
function saveChat(){
  try{
    var toSave = STATE.messages.slice(-30);
    localStorage.setItem(STORE_KEY + '_chat', JSON.stringify(toSave));
  }catch(e){}
}

/* ============================================================
   থিম
   ============================================================ */
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  STATE.theme = next;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ theme: next }));
  }catch(e){}
  updateThemeIcon();
}

function updateThemeIcon(){
  var t = document.documentElement.getAttribute('data-theme');
  var icon = document.getElementById('themeIcon');
  if(icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

/* ============================================================
   Toast
   ============================================================ */
var TOAST_TIMER = null;
function showToast(msg, type){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast';
  if(type) t.classList.add(type);
  t.classList.add('show');
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

/* ============================================================
   Helper
   ============================================================ */
function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

/* ============================================================
   Keyboard shortcut
   ============================================================ */
document.addEventListener('keydown', function(e){
  // Escape → হোমে ফিরি
  if(e.key === 'Escape'){
    if(document.getElementById('chatContainer').classList.contains('active')){
      goHome();
    }
  }
  // Ctrl+K → নতুন চ্যাট
  if(e.ctrlKey && e.key === 'k'){
    e.preventDefault();
    clearChat();
  }
});
</script>
